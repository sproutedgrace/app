<style>
@font-face{font-family:'EB Garamond';src:url(fonts/EBGaramond-Regular.woff) format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'EB Garamond';src:url(fonts/EBGaramond-SemiBold.woff) format('woff');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'EB Garamond';src:url(fonts/EBGaramond-Italic.woff) format('woff');font-weight:400;font-style:italic;font-display:swap}
:root{
  --green:#239E46; --green-ink:#17733A; --lime:#65D916; --gold:#D4A017; --gold-ink:#8A6508; --white:#FFFFFF;
  --bg:#FAF6EC; --paper:#FFFDF8; --edge:#E6DCC4; --line:#E9E0CB; --text:#2B2E28; --muted:#615F55;
  --jesus:#B3141B;          /* red: only for the words of Jesus */
  --hl1:#FCEFB4; --hl2:#D7F2C2; --hl3:#D4E8F7;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --nav:68px; --r:14px; --scale:1;
}
html.night{
  --bg:#191A16; --paper:#22231E; --edge:#3A382E; --line:#35332A; --text:#ECE6D6; --muted:#B4AE9C;
  --green-ink:#6BCB86; --gold-ink:#E2B941; --jesus:#FF7B72; --hl1:#5A4C12; --hl2:#244A2C; --hl3:#1F3D57;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* faint linen weave */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(120,100,60,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(120,100,60,.03) 0 1px,transparent 1px 4px)}
html.night body::before{opacity:.15}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;color:var(--text)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:var(--green-ink);font-weight:600;text-underline-offset:3px}
.app{max-width:680px;margin:0 auto;min-height:100%;padding:0 16px calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}

/* header */
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);margin:0 -16px 16px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:16px;right:16px;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.brand img{width:42px;height:42px;display:block;object-fit:contain}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.05;color:var(--green-ink)}
.brand small{display:block;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.badge{font-size:11px;font-weight:700;letter-spacing:.12em;padding:5px 11px;border-radius:999px;border:1px solid var(--edge);color:var(--muted);white-space:nowrap;background:var(--paper)}
.badge.admin{border-color:var(--gold);color:var(--gold-ink)}
.preview-bar{font-size:13px;font-weight:600;text-align:center;padding:8px;border:1px dashed var(--gold);border-radius:10px;color:var(--gold-ink);margin-bottom:14px;background:var(--paper)}

/* type */
.hero{margin:6px 0 16px}
.hero h1{font-size:32px;color:var(--text)}
.hero p{color:var(--muted);margin-top:2px}
.tagline{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--green-ink)}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink);margin:24px 0 12px}
.eyebrow::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.7}
.note{font-size:15px;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}

/* cards */
.card{background:var(--paper);border:1px solid var(--edge);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px rgba(90,70,30,.07)}
.card h2{font-size:24px;margin-bottom:8px}
.card p{margin-bottom:10px}.card p:last-child{margin-bottom:0}
.card.gilt{border-top:3px solid var(--gold)}
.card.dash{border-style:dashed;box-shadow:none;background:transparent}
.ticks{list-style:none;margin:8px 0 12px}
.ticks li{padding-left:26px;position:relative;margin:6px 0}
.ticks li::before{content:"";position:absolute;left:2px;top:9px;width:12px;height:7px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}

/* buttons: big bold text so white on green stays easy to read */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 22px;border-radius:12px;border:1px solid #1C8A3C;background:var(--green);color:#fff;
  font-family:var(--sans);font-weight:700;font-size:19px;cursor:pointer;text-decoration:none;min-height:50px;text-align:center;box-shadow:0 2px 0 #1A7A36}
.btn:hover{filter:brightness(1.05)}
a.btn{color:#fff}
.btn.outline,a.btn.outline{background:var(--paper);color:var(--green-ink);border:1.5px solid var(--green);box-shadow:none;font-size:17px}
.btn.gold,a.btn.gold{background:var(--paper);color:var(--gold-ink);border:1.5px solid var(--gold);box-shadow:none;font-size:17px}
.btn.quiet{background:transparent;color:var(--muted);border:1px solid var(--edge);box-shadow:none;font-size:16px;font-weight:600}
.btn.small{min-height:40px;padding:6px 14px;font-size:15px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
label{display:block;font-weight:600;font-size:15px;margin:14px 0 6px;color:var(--text)}
input,textarea,select{width:100%;background:var(--paper);border:1px solid #CFC4AA;border-radius:10px;padding:11px 13px;font-size:16px;color:var(--text)}
html.night input,html.night textarea,html.night select{border-color:#4A473B}
input::placeholder,textarea::placeholder{color:#8B887C}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(35,158,70,.18)}
input[type=file]{padding:8px}
input[type=checkbox],input[type=range]{width:auto;accent-color:var(--green)}
textarea{min-height:110px;resize:vertical}
.count{font-size:13px;color:var(--muted);text-align:right;margin-top:4px}
.tabs{display:flex;border:1px solid var(--edge);border-radius:12px;overflow:hidden;margin-bottom:6px;background:var(--paper)}
.tabs button{flex:1;background:transparent;border:0;padding:10px 6px;font-size:15px;line-height:1.3;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--green);color:#fff}
.optin{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:15px;margin:14px 0 0;cursor:pointer}
.optin input{width:20px;height:20px;flex:none;margin-top:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--edge);border-radius:999px;padding:6px 12px;font-size:14.5px;font-weight:600;background:var(--paper);cursor:pointer;color:var(--text);text-decoration:none}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chips.fit{gap:6px}.chips.fit .chip{flex:1 1 auto;text-align:center;padding:6px 7px;font-size:14px}

/* home */
.banner{position:relative;margin:0 0 16px;border-radius:var(--r);overflow:hidden;aspect-ratio:3/2;max-height:340px;width:100%;background:#6b5d4f;box-shadow:0 10px 26px rgba(60,45,20,.18)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;background:linear-gradient(transparent,rgba(20,18,12,.78));color:#fff}
.banner .cap b{display:block;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15}
.banner .cap span{display:block;font-family:var(--serif);font-style:italic;font-size:18px;opacity:.95;margin-top:2px}
.votd{text-align:center;padding:26px 20px}
.votd .ref{font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-ink)}
.votd blockquote{font-family:var(--serif);font-size:calc(24px * var(--scale));line-height:1.4;margin:12px 0 14px;color:var(--text)}
.live-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--lime);margin-right:6px;box-shadow:0 0 0 4px rgba(101,217,22,.2)}
.next-live{font-family:var(--serif);font-size:22px;margin:4px 0 6px}
.extra{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

/* scripture */
.jw{color:var(--jesus)}
.scripture{font-family:var(--serif);font-size:calc(21px * var(--scale));line-height:1.75;padding:22px 20px 26px}
.scripture h2{font-size:calc(28px * var(--scale));text-align:center;margin-bottom:4px}
.scripture .tr{text-align:center;font-family:var(--sans);font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:14px}
.v{cursor:pointer;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:1px 0;transition:background .2s}
.v sup{font-family:var(--sans);font-size:.55em;font-weight:700;color:var(--gold-ink);margin:0 3px 0 6px;vertical-align:.5em}
.v.sel{outline:2px dashed var(--green);outline-offset:1px}
.v.h1{background:var(--hl1)}.v.h2{background:var(--hl2)}.v.h3{background:var(--hl3)}
.v .mk{font-family:var(--sans);font-size:.6em;color:var(--gold-ink);margin-left:3px;vertical-align:.4em}
.v.flash{background:rgba(212,160,23,.28)}
.bbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.bbar .pick{flex:1;justify-content:space-between}
.seg{display:inline-flex;border:1.5px solid var(--green);border-radius:12px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--paper);color:var(--green-ink);font-weight:700;font-size:14px;padding:0 12px;min-height:40px;cursor:pointer}
.seg button.on{background:var(--green);color:#fff}
.bbar{flex-wrap:wrap}
.trsel{width:100%;max-width:none;flex:1 1 100%;min-height:40px;padding:6px 8px;font-size:14px;font-weight:700;color:var(--green-ink);border:1.5px solid var(--green);border-radius:12px}
.bbar .trsel:only-child{max-width:100%;width:100%}
.xnote{text-align:center;font-family:var(--sans);font-size:13px;color:var(--muted);margin:-8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid.books{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.grid button{min-height:46px;border:1px solid var(--edge);background:var(--paper);border-radius:10px;font-weight:600;cursor:pointer;color:var(--text);font-size:15px;padding:4px 6px}
.grid button:hover{border-color:var(--green)}
.pager{display:flex;justify-content:space-between;align-items:center;margin:14px 0;gap:12px}
.result{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--text)}
.result b{font-size:13px;letter-spacing:.06em;color:var(--gold-ink);text-transform:uppercase}
.result .t{font-family:var(--serif);font-size:calc(19px * var(--scale));line-height:1.5;margin-top:2px}
mark{background:var(--hl1);color:inherit;padding:0 1px;border-radius:3px}
.rl-ch{font-family:var(--serif);font-size:22px;margin:22px 0 6px;color:var(--green-ink)}
.rl-v{font-family:var(--serif);font-size:calc(20px * var(--scale));line-height:1.6;padding:6px 0;border-top:1px solid var(--line)}
.rl-v a{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--gold-ink);text-decoration:none;margin-right:6px}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime))}
.day{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.day input{width:24px;height:24px;flex:none}
.day.done .what{color:var(--muted);text-decoration:line-through}

/* red letters guide */
.gcx{background:linear-gradient(180deg,#F3FAF2,var(--paper));border:1px solid #CFE6CF;border-left:4px solid var(--green);border-radius:12px;padding:10px 14px;margin:14px 0 10px;font-family:var(--sans);font-size:15.5px;line-height:1.5}
html.night .gcx{background:#1F2A20;border-color:#2F4A32}
.gcx summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none}
.gcx summary::-webkit-details-marker{display:none}
.gcx summary b{display:block;color:var(--green-ink);font-size:15px}.gcx summary small{color:var(--muted);font-size:12.5px}
.gcx summary::after{content:"Show";margin-left:auto;font-size:12.5px;font-weight:700;color:var(--green-ink)}
.gcx[open] summary::after{content:"Hide"}
.gcx p{margin:8px 0 0;color:var(--text)}
.vtip{display:flex;gap:10px;align-items:flex-start;background:#FFF8E1;border:1px solid #EBD9A2;border-radius:14px;border-top-left-radius:4px;padding:10px 12px;margin:6px 0 10px 18px;font-family:var(--sans);font-size:14.5px;line-height:1.45;position:relative;animation:pop .35s ease-out}
html.night .vtip{background:#2E2914;border-color:#5A4C12}
.vtip::before{content:"";position:absolute;top:-7px;left:14px;border:7px solid transparent;border-top:0;border-bottom-color:#EBD9A2}
.vtip b{color:var(--gold-ink);font-size:13px;letter-spacing:.04em}.vtip p{margin:2px 0 0;color:var(--text)}
.vt-ic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);border:1px solid #EBD9A2;display:flex;align-items:center;justify-content:center}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.v .tipdot{font-family:var(--sans);font-size:.62em;margin-left:3px;vertical-align:.35em;cursor:pointer}
.guidebar{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--edge);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.guidebar .sw{margin-left:auto}
.rl-book{font-family:var(--serif);font-size:30px;text-align:center;margin:30px 0 4px;color:var(--text)}
.rl-book:first-child{margin-top:4px}
.bgsel{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bgsel select{width:auto;font-size:15px;padding:8px 10px}

/* word study */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;background:var(--paper);border:1px solid var(--edge);border-radius:12px;padding:10px 8px;cursor:pointer;color:var(--text);min-height:110px;justify-content:center}
.wd:hover{border-color:var(--green)}
.wd .o{font-size:24px;line-height:1.3;font-family:'SBL Hebrew','Ezra SIL','Times New Roman',var(--serif)}
.wd .o[lang=grc]{font-family:'Gentium Plus','Times New Roman',var(--serif);font-size:22px}
.wd .x{font-size:13px;color:var(--muted);font-style:italic}
.wd .g{font-size:15px;font-weight:600}
.wd .s,.chipS{font-size:11.5px;font-weight:700;color:var(--gold-ink);letter-spacing:.04em}
.lemma{font-size:44px;line-height:1.2;text-align:center;margin:6px 0}
.dl dt{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin-top:14px}
.dl dd{margin:2px 0 0;font-size:17px}
.credit{font-size:12.5px;color:var(--muted);text-align:center;margin-top:12px}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(20,18,10,.35);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-radius:18px 18px 0 0;border-top:3px solid var(--gold);padding:16px 18px calc(18px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto;box-shadow:0 -10px 30px rgba(0,0,0,.18);max-height:85vh;overflow:auto}
.sheet h3{font-size:22px;margin-bottom:10px}
.dots{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.dots button{width:40px;height:40px;border-radius:50%;border:2px solid var(--edge);cursor:pointer}
.dots button.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(35,158,70,.25)}

function initials(name){ return esc(String(name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()); }
function avatar(p, size=40){
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size*.38)}px`;
  return p?.avatar_url ? `<img class="ava" style="${st}" src="${esc(p.avatar_url)}" alt="">` : `<span class="ava" style="${st}" aria-hidden="true">${initials(p?.display_name||p?.username)}</span>`;
}
function whoLink(p, size=36){
  if(!p) return `<span class="who">${avatar({display_name:'?'},size)}<span><b>A member</b><br><span class="un">Name hidden</span></span></span>`;
  return `<a class="who" href="#/u/${esc(p.username||p.id)}">${avatar(p,size)}<span><b>${esc(p.display_name||p.username)}</b>${p.username?`<br><span class="un">@${esc(p.username)}</span>`:''}</span></a>`;
}
async function loadPeople(ids){
  const need=[...new Set(ids.filter(Boolean))].filter(id=>!S.people[id]);
  if(!need.length) return;
  if(S.preview){ need.forEach(id=>S.people[id]=PREVIEW.people[id] || (id==='me'?{...S.profile,id:'me'}:null)); return; }
  const { data } = await S.sb.from('public_profiles').select('*').in('id',need);
  (data||[]).forEach(p=>S.people[p.id]=p);
}

async function loadProfile(){
  if(S.preview){ S.profile = S.profile || {display_name:'Preview Friend', username:'preview'}; return; }
  if(!S.user){ S.profile=null; S.isAdmin=false; S.isPartner=false; return; }

  S.profile = (Array.isArray(data)?data[0]:data) || {};
  S.isAdmin = !!S.profile.is_admin; S.isPartner = !!S.profile.is_partner;
  delete S.people[S.user.id];
}
async function loadLibrary(){
  if(S.preview){ S.rows=PREVIEW.rows; S.allVolumes=PREVIEW.volumes; S.volumes=PREVIEW.volumes.filter(v=>v.status!=='hidden'); return; }
  const [r,v] = await Promise.all([S.sb.from('library_rows').select('*').order('sort'), S.sb.from('volumes').select('*').order('sort')]);

  S.rows = r.data||[]; S.allVolumes = v.data||[]; S.volumes = S.allVolumes.filter(x=>x.status!=='hidden');

/* ============ BIBLE DATA ============ */
const BIB = {extra:{}};
const bk = (tr,b) => b>=EXTRA ? BIB.extra : (BIB[tr] ||= {});
async function getBook(tr, b){
  const box = bk(tr,b);
  if(box[b]) return box[b];
  const r = await fetch(b>=EXTRA ? `bible/extra/${b+1}.json` : `bible/${tr}/${b+1}.json`);
  if(!r.ok) throw new Error('This book did not load. Check your connection and try again.');
  return (box[b] = (await r.json()).c);
}
async function getAll(tr, onStep){
  let done=0; const out=[];
  for(let i=0;i<66;i+=11){
    const part = await Promise.all(BOOKS.slice(i,i+11).map((_,k)=>getBook(tr,i+k).then(x=>{ onStep&&onStep(++done); return x; })));
    out.push(...part);
  }
  return out;
}
const plain = t => String(t||'').replace(/[{}]/g,'');
const redHTML = t => esc(t).replace(/\{/g,'<span class="jw">').replace(/\}/g,'</span>');
const redOnly = t => (String(t||'').match(/\{[^}]*\}/g)||[]).map(s=>s.slice(1,-1)).join(' … ');
const BKEY='sg.bible';
function bstate(){ const s=store(BKEY)||{}; s.hl ||= {}; s.bm ||= {}; s.notes ||= {}; s.plans ||= {}; s.pos ||= {tr:'kjv',b:42,c:1}; if(!TRANS[s.pos.tr]) s.pos.tr='kjv'; s.size ||= 1; if(s.guide===undefined) s.guide=true; return s; }
function bsave(s){ s.updated=Date.now(); store(BKEY,s); }
function applyLook(){ const s=bstate(); document.documentElement.style.setProperty('--scale', s.size||1); document.documentElement.classList.toggle('night', !!s.night);
  document.querySelector('meta[name=theme-color]').content = s.night ? '#191A16' : '#FAF6EC'; }
const rk = (b,c,v) => `${b}.${c}.${v}`;

function dayIndex(){ const p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); return Math.floor(Date.parse(p+'T00:00:00Z')/864e5); }
function chiParts(d){ const o={}; new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',weekday:'short'}).formatToParts(d).forEach(p=>o[p.type]=p.value); return o; }
function chicagoDate(y,m,d,h,mi){   // a Central time -> real Date
  let t = Date.UTC(y,m-1,d,h,mi);
  for(let i=0;i<2;i++){ const p=chiParts(new Date(t)); const asUtc=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute); t += Date.UTC(y,m-1,d,h,mi) - asUtc; }
  return new Date(t);
}
function nextDefaultLive(){
  const now=new Date();
  for(let i=0;i<8;i++){
    const p=chiParts(new Date(now.getTime()+i*864e5));
    const start=chicagoDate(+p.year,+p.month,+p.day,CONFIG.LIVE_HOUR,0);
    if(chiParts(start).weekday!==['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][CONFIG.LIVE_DAY]) continue;
    if(start.getTime()+CONFIG.LIVE_MINUTES*6e4 > now.getTime()) return start;
  }
  return null;
}
const fmtCentral = d => new Date(d).toLocaleString('en-US',{timeZone:'America/Chicago',weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}).replace(':00','') + ' Central';
async function loadLive(){
  if(S.preview) return PREVIEW.live;
  const { data } = await S.sb.from('live_times').select('*').gte('starts_at', new Date(Date.now()-3*36e5).toISOString()).order('starts_at').limit(10);
  return data||[];
}

async function viewRead(tr, b, c, v){
  renderNav('bible');
  const s=bstate();
  tr = TRANS[tr] ? tr : s.pos.tr; b = Math.max(0,Math.min(BOOKS.length-1, isNaN(b)?s.pos.b:b)); c = Math.max(1,Math.min(BOOKS[b][1], c||1));
  s.pos={tr,b,c}; bsave(s);
  $app.innerHTML = header()+bibleTabs('read')+`<div class="bbar">${b>=EXTRA?'':trSeg(tr)}<a class="btn outline small pick" href="#/bible/pick">${esc(refName(b,c))} <span aria-hidden="true">▾</span></a><button class="btn quiet small" id="aa" aria-label="Reading settings">Aa</button></div>
    <article class="card scripture" id="chap"><p class="empty">Opening…</p></article>`;
  bindTrSeg(t=>location.hash=`#/bible/read/${t}/${b}/${c}`);
  document.getElementById('aa').onclick=()=>lookSheet();
  let chs; try{ chs = await getBook(tr,b); }catch(e){ document.getElementById('chap').innerHTML=`<p class="empty">${esc(e.message)}</p>`; return; }
  const verses = chs[c-1]||[];
  const st=bstate();
  const lo = b>=EXTRA ? EXTRA : 0, hi = b>=EXTRA ? BOOKS.length-1 : EXTRA-1;
  const prev = c>1 ? [b,c-1] : b>lo ? [b-1,BOOKS[b-1][1]] : null;
  const next = c<BOOKS[b][1] ? [b,c+1] : b<hi ? [b+1,1] : null;
  const vHTML = (t,i) => { const k=rk(b,c,i+1); const h=st.hl[k]; return `<span class="v ${h?'h'+h:''}" data-v="${i+1}" tabindex="0" role="button" aria-label="Verse ${i+1}. Tap for options."><sup>${i+1}</sup>${redHTML(t)}${st.bm[k]?'<span class="mk" title="Bookmarked">🔖</span>':''}${st.notes[k]?'<span class="mk" title="Has a note">✎</span>':''}${vtips[k]?'<span class="tipdot" title="Context note">🌱</span>':''}</span> `; };
  const G = (st.guide!==false && b>=39 && b<EXTRA) ? await guide() : null;
  const vtips = G ? G.v : {};
  document.getElementById('chap').innerHTML = `<h2>${esc(refName(b,c))}</h2><div class="tr">${b>=EXTRA?EXTRA_SRC[b]:TRANS[tr]}</div>${b>=EXTRA?'<p class="xnote">This book is not in most Bibles. It is here for study.</p>':''}${G?guideCard(G,b,c,false):''}<div>${verses.map((t,i)=>t?vHTML(t,i):'').join('')}</div>`;
  $app.querySelector('.foot')?.remove();
  $app.insertAdjacentHTML('beforeend', `<div class="pager"><button class="btn outline small" id="pv" ${prev?'':'disabled'}>‹ ${prev?esc(refName(...prev)):''}</button><button class="btn small" id="nx" ${next?'':'disabled'}>${next?esc(refName(...next)):''} ›</button></div>
    ${b<EXTRA?`<div class="bgsel"><label for="bgv" class="note" style="margin:0">Read ${esc(refName(b,c))} in another version:</label><select id="bgv"><option value="">Pick one…</option>${BG_VERSIONS.map(([k,l])=>`<option value="${k}">${esc(l)} (${k})</option>`).join('')}</select></div>`:''}
    <p class="note" style="text-align:center">Tap a verse to highlight, save, copy, or share it. Swipe to turn the page.${G&&Object.keys(vtips).some(k=>k.startsWith(b+'.'+c+'.'))?' Tap 🌱 for a context note.':''}</p>
    <p class="note" style="text-align:center;font-size:13px;margin-top:6px">The King James Version and the World English Bible are in the public domain.</p>${footer()}`);

function shelfRow(row){

  const cards = items.length ? (loop ? [...items.map(v=>poster(v,true)),...items.map(v=>poster(v,false)),...items.map(v=>poster(v,true))].join('') : items.map(v=>poster(v,false)).join(''))
              : `<div class="soon">New lessons will show up here.</div>`;

    ${items.length>1?`<button class="arrow l" data-dir="-1" aria-label="Back in ${esc(row.name)}">‹</button><button class="arrow r" data-dir="1" aria-label="Next in ${esc(row.name)}">›</button>`:''}
    <div class="track" data-n="${items.length}" data-loop="${loop?1:0}">${cards}</div></section>`;

function setupRows(){
  document.querySelectorAll('.shelfrow').forEach(row=>{
    const track=row.querySelector('.track'); const n=+track.dataset.n; const loop=track.dataset.loop==='1';
    const first=track.querySelector('.poster'); if(!first) return;
    const step = first.getBoundingClientRect().width + 14;
    if(loop){
      const setW = step*n; track.scrollLeft = setW;
      let t; track.addEventListener('scroll',()=>{ clearTimeout(t); t=setTimeout(()=>{
        if(track.scrollLeft < setW*0.5) track.scrollLeft += setW;
        else if(track.scrollLeft >= setW*1.5) track.scrollLeft -= setW; },140); },{passive:true});
    }
    row.querySelectorAll('.arrow').forEach(a=>a.onclick=()=>{
      const d=+a.dataset.dir;
      if(!loop && d>0 && track.scrollLeft + track.clientWidth >= track.scrollWidth - 4) return track.scrollTo({left:0,behavior:'smooth'});
      if(!loop && d<0 && track.scrollLeft <= 4) return track.scrollTo({left:track.scrollWidth,behavior:'smooth'});
      track.scrollBy({left:d*step,behavior:'smooth'});
    });
  });
}

function embedUrl(u){
  const y = String(u).match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if(y) return 'https://www.youtube-nocookie.com/embed/'+y[1];
  const m = String(u).match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if(m) return 'https://player.vimeo.com/video/'+m[1];
  return null;
}
async function fileUrl(f){
  if(!f || !f.file_path) return '';
  if(f.bucket==='site') return f.file_path;
  if(f.bucket==='library-public') return S.sb.storage.from('library-public').getPublicUrl(f.file_path).data.publicUrl;
  const { data } = await S.sb.storage.from('library-sealed').createSignedUrl(f.file_path, 3600);
  return data?.signedUrl || '';
}
async function pdfjs(){
  if(!window.__pdfjs){ const m = await import(CONFIG.PDFJS.lib); m.GlobalWorkerOptions.workerSrc = CONFIG.PDFJS.worker; window.__pdfjs = m; }
  return window.__pdfjs;
}
let pdfZoom = 1;
async function renderPdf(url, box){
  box.innerHTML = '<p class="empty">Opening…</p>';
  try{
    const lib = await pdfjs();
    const doc = await lib.getDocument({ url }).promise;
    box.innerHTML = '';
    const width = Math.min(box.clientWidth || 360, 900);
    for(let i=1;i<=doc.numPages;i++){
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale:1 });
      const scale = (width - 8) / base.width * pdfZoom;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: scale * dpr });
      const fig = document.createElement('figure'); fig.className='pdfpage';
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      c.style.width = (vp.width/dpr)+'px'; c.setAttribute('role','img'); c.setAttribute('aria-label',`Page ${i}`);
      const cap = document.createElement('figcaption'); cap.textContent = `Page ${i} of ${doc.numPages}`;
      fig.append(c, cap); box.appendChild(fig);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    }
  }catch(e){
    console.error(e);
    box.innerHTML = `<p class="empty">The lesson did not open here.</p><div class="row" style="justify-content:center"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Open the PDF</a></div>`;
  }
}
function bindPdf(url){
  const box=document.getElementById('pdfbox');
  document.getElementById('zIn').onclick=()=>{ pdfZoom=Math.min(2.5,pdfZoom+0.25); renderPdf(url, box); };
  document.getElementById('zOut').onclick=()=>{ pdfZoom=Math.max(0.75,pdfZoom-0.25); renderPdf(url, box); };
  renderPdf(url, box);
}

async function uploadCover(file){
  if(file.size > 5*1024*1024) throw new Error('Cover images must be under 5 MB.');
  const ext=(file.name.match(/\.[a-z0-9]+$/i)||['.jpg'])[0].toLowerCase();
  const path=`covers/${Date.now()}-${slug(file.name.replace(/\.[^.]+$/,''))}${ext}`;
  const { error } = await S.sb.storage.from('library-public').upload(path, file, { contentType:file.type||undefined, upsert:false });
  if(error) throw error;
  return S.sb.storage.from('library-public').getPublicUrl(path).data.publicUrl;
}
// Change who can open an item. Moves its file to the public or private folder to match.
async function setAccess(id, tier){
  const { data:f } = await S.sb.from('library_files').select('bucket,file_path').eq('volume_id',id).maybeSingle();
  const want = tier==='free' ? 'library-public' : 'library-sealed';
  if(f?.file_path && f.bucket && f.bucket!=='site' && f.bucket!==want){
    const dl = await S.sb.storage.from(f.bucket).download(f.file_path); if(dl.error) throw dl.error;
    const up = await S.sb.storage.from(want).upload(f.file_path, dl.data, { contentType:dl.data.type||undefined, upsert:true }); if(up.error) throw up.error;
    const u1 = await S.sb.from('library_files').update({ bucket:want }).eq('volume_id',id); if(u1.error) throw u1.error;
    await S.sb.storage.from(f.bucket).remove([f.file_path]);
  }
  const { error } = await S.sb.from('volumes').update({ tier }).eq('id',id); if(error) throw error;
}

      const { error } = await S.sb.storage.from(bucket).upload(file_path, file, { contentType:file.type||undefined, upsert:false });
      if(error){ btn.disabled=false; btn.textContent='Add to Library'; return toast('Upload failed: '+error.message); }
    }
    btn.disabled=true; btn.textContent='Saving…';
    const id = slug(title)+'-'+Date.now().toString(36).slice(-4);
    const sort = Math.max(0, ...items.map(i=>i.sort||0)) + 1;
    const r1 = await S.sb.from('volumes').insert({ id, title, subtitle:desc, status:'live', sort, kind, tier, row_id, cover_url });
    const r2 = r1.error || k==='soon' ? r1 : await S.sb.from('library_files').insert({ volume_id:id, bucket, file_path, video_url });
    if(r1.error || r2.error){
      if(file_path) await S.sb.storage.from(bucket).remove([file_path]);
      if(!r1.error) await S.sb.from('volumes').delete().eq('id',id);
      btn.disabled=false; btn.textContent='Add to Library';
      return toast('It did not save: '+(r1.error||r2.error).message);
    }
    toast('Added to the Library.'); viewAdmin();
  };
  $app.querySelectorAll('[data-rsave]').forEach(b=>b.onclick=async()=>{ const name=$app.querySelector(`[data-rname="${b.dataset.rsave}"]`).value.trim(); if(!name) return toast('Please add a name.');
    if(S.preview){ PREVIEW.rows.find(r=>r.id==b.dataset.rsave).name=name; toast('Preview: saved.'); return viewAdmin(); }
    const { error } = await S.sb.from('library_rows').update({name}).eq('id',+b.dataset.rsave); toast(error?error.message:'Row renamed.'); viewAdmin(); });
  $app.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{ const r=S.rows.find(x=>x.id==b.dataset.rdel); if(!r || !confirm(`Remove the empty row "${r.name}"?`)) return;
    if(S.preview){ PREVIEW.rows.splice(PREVIEW.rows.indexOf(r),1); toast('Preview: row removed.'); return viewAdmin(); }
    const { error } = await S.sb.from('library_rows').delete().eq('id',r.id); toast(error?error.message:'Row removed.'); viewAdmin(); });
  $app.querySelectorAll('[data-rup]').forEach(b=>b.onclick=async()=>{ const i=S.rows.findIndex(r=>r.id==b.dataset.rup); if(i<1) return; const a=S.rows[i-1], c=S.rows[i];
    if(S.preview){ [a.sort,c.sort]=[c.sort,a.sort]; PREVIEW.rows.sort((x,y)=>x.sort-y.sort); return viewAdmin(); }
    await S.sb.from('library_rows').update({sort:c.sort}).eq('id',a.id); const { error } = await S.sb.from('library_rows').update({sort:a.sort}).eq('id',c.id); if(error) toast(error.message); viewAdmin(); });
  document.getElementById('addRow').onclick=async()=>{ const name=document.getElementById('newRow').value.trim(); if(!name) return toast('Please add a name.');
    const sort=Math.max(0,...S.rows.map(r=>r.sort||0))+1;
    if(S.preview){ PREVIEW.rows.push({id:Date.now(),name,sort}); toast('Preview: row added.'); return viewAdmin(); }
    const { error } = await S.sb.from('library_rows').insert({name,sort}); toast(error?error.message:'Row added.'); viewAdmin(); };
  $app.querySelectorAll('[data-row]').forEach(s=>s.onchange=async()=>{ if(S.preview) return previewOnly();
    const { error } = await S.sb.from('volumes').update({ row_id:+s.value }).eq('id',s.dataset.row); toast(error ? error.message : 'Moved.'); });
  $app.querySelectorAll('[data-tier]').forEach(s=>s.onchange=async()=>{ if(S.preview) return previewOnly();
    s.disabled=true; try{ await setAccess(s.dataset.tier, s.value); toast('Access changed.'); }catch(e){ toast('It did not change: '+(e.message||e)); } viewAdmin(); });
  $app.querySelectorAll('[data-cover]').forEach(inp=>inp.onchange=async()=>{
    const f=inp.files[0]; if(!f) return; if(S.preview) return previewOnly();
    try{ const url=await uploadCover(f); const { error } = await S.sb.from('volumes').update({ cover_url:url }).eq('id',inp.dataset.cover); if(error) throw error; toast('Cover updated.'); viewAdmin(); }
    catch(e){ toast(e.message||'Cover upload failed.'); }
  });
  $app.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{
    if(S.preview) return previewOnly();
    const v=items.find(x=>x.id===b.dataset.toggle);
    const { error } = await S.sb.from('volumes').update({ status: v.status==='hidden'?'live':'hidden' }).eq('id',v.id);
    if(error) return toast(error.message); toast(v.status==='hidden'?'It is back in the Library.':'It is hidden now.'); viewAdmin();
  });
  $app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(S.preview) return previewOnly();
    const v=items.find(x=>x.id===b.dataset.del);
    if(!confirm(`Delete "${v.title}"? This also deletes its file. It cannot be undone.`)) return;
    const { data:f } = await S.sb.from('library_files').select('bucket,file_path').eq('volume_id',v.id).maybeSingle();
    if(f?.file_path && f?.bucket) await S.sb.storage.from(f.bucket).remove([f.file_path]);
    const { error } = await S.sb.from('volumes').delete().eq('id',v.id);
    if(error) return toast(error.message); toast('Deleted.'); viewAdmin();
  });
}

async function loadRooms(){ if(S.preview){ S.rooms=PREVIEW.rooms; return; } const { data } = await S.sb.from('forum_rooms').select('*').order('sort'); S.rooms=data||[]; }
const prayerRoom = id => S.rooms.find(r=>r.id===id)?.kind==='prayer';
const covRoom = id => S.rooms.find(r=>r.id===id)?.kind==='covenant';
async function prayedInfo(ids){
  if(S.preview){ return { counts:Object.fromEntries(PREVIEW.threads.map(t=>[t.id,t.prayed+(S.demoPrayed[t.id]?1:0)])), mine:{...S.demoPrayed} }; }
  if(!ids.length) return {counts:{},mine:{}};

  const counts={}, mine={}; (data||[]).forEach(r=>{ counts[r.thread_id]=r.n; if(r.mine) mine[r.thread_id]=true; });

}
async function togglePrayed(id, on){
  if(S.preview){ if(on) S.demoPrayed[id]=true; else delete S.demoPrayed[id]; return true; }
  const r = on ? await S.sb.from('prayers').insert({thread_id:id, user_id:S.user.id}) : await S.sb.from('prayers').delete().eq('thread_id',id).eq('user_id',S.user.id);

function prayBtn(id, n, mine){ return `<button class="pray ${mine?'on':''}" data-pray="${id}" data-mine="${mine?1:0}" aria-pressed="${!!mine}">🙏 ${mine?'You prayed':'Prayed for this'} · ${n||0}</button>`; }

    if(!title||!body) return toast('Please add a title and a message.');
    if(S.preview){ PREVIEW.threads.unshift({id:Date.now(),room_id:room,author_id:anon?null:'me',secret:anon?'me':null,anonymous:anon,title,body,created_at:new Date().toISOString(),prayed:0,posts:[]}); toast('Preview: posted.'); location.hash='#/fellowship'; return viewFellowship(); }
    const { error } = await S.sb.rpc('create_thread',{p_room:room,p_title:title,p_body:body,p_anon:anon});

async function viewThread(id){
  renderNav('fellowship');
  if(!signedIn()) return viewFellowship();
  if(!S.rooms.length) await loadRooms();
  let t, posts, secret=null;
  if(S.preview){ t=PREVIEW.threads.find(x=>x.id===+id); posts=t?.posts||[]; secret=t?.secret||null; }
  else {
    t=(await S.sb.from('forum_threads').select('id,title,body,created_at,author_id,anonymous,room_id').eq('id',id).maybeSingle()).data;
    posts=(await S.sb.from('forum_posts').select('id,body,created_at,author_id').eq('thread_id',id).order('created_at')).data||[];
    if(t?.anonymous && admin()){ const { data } = await S.sb.from('thread_secret_authors').select('author_id').eq('thread_id',id).maybeSingle(); secret=data?.author_id||null; }
  }
  if(!t){ $app.innerHTML=header()+`<div class="reader-head"><button class="back" onclick="location.hash='#/fellowship'">‹ Fellowship</button></div><div class="empty">This post was removed.</div>`; return; }
  await loadPeople([t.author_id, secret, ...posts.map(p=>p.author_id)]);
  const isP = prayerRoom(t.room_id);
  const pr = isP ? await prayedInfo([t.id]) : null;

async function resizeImage(file, size=320){
  const src=URL.createObjectURL(file);
  try{
    const img = await new Promise((ok,bad)=>{ const i=new Image(); i.onload=()=>ok(i); i.onerror=()=>bad(new Error('That image did not open. Try a JPG or PNG.')); i.src=src; });
    const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=size;
    c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.86));
  } finally { URL.revokeObjectURL(src); }
}

    const p=S.profile||{};
    const args={ p_display_name: document.getElementById('pName').value.trim(), p_username: document.getElementById('pUser').value.trim()||null,
      p_bio: bio.value.trim()||null, p_avatar_url: ('avatar' in extra)?extra.avatar:(p.avatar_url||null) };

    if(S.preview){ Object.assign(S.profile,{display_name:args.p_display_name,username:args.p_username,bio:args.p_bio}); toast('Preview: profile saved.'); viewAccount(); return true; }

  document.getElementById('out').onclick=async()=>{ if(S.preview){S.demoUser=false;S.demoAdmin=false;} else await S.sb.auth.signOut(); location.hash='#/home'; };
}
async function doAuth(){
  const id=document.getElementById('aEmail').value.trim(), pass=document.getElementById('aPass').value;
  if(!id||pass.length<8) return toast('Fill in each box. Use a password with 8 or more characters.');
  if(S.preview){ S.demoUser=true; toast('Preview: you are signed in.'); return viewAccount(); }
  const btn=document.getElementById('aGo'); btn.disabled=true;
  try{
    if(authTab==='up'){
      const username=document.getElementById('aUser').value.trim();
      if(!/^[A-Za-z0-9_]{3,20}$/.test(username)) return toast('Usernames are 3 to 20 letters, numbers, or _.');
      if(!id.includes('@')) return toast('Please type a real email address.');
      const { data:free } = await S.sb.rpc('username_available',{p_username:username});
      if(free===false) return toast('That username is taken. Please try another.');
      const name=(document.getElementById('aName').value.trim()||username).slice(0,40);
      const { data, error } = await S.sb.auth.signUp({email:id,password:pass,options:{data:{display_name:name, username, marketing_opt_in: !!document.getElementById('aOpt')?.checked},emailRedirectTo:location.origin}});
      if(error) return toast(error.message);
      if(!data.session) return toast('Almost done. Check your email and tap the link.');
    } else {
      let email=id;
      if(!id.includes('@')){
        const { data, error } = await S.sb.rpc('login_email',{p_username:id,p_password:pass});
        if(error) return toast(error.message);
        if(!data) return toast('That username and password do not match.');
        email=data;
      }
      const { error } = await S.sb.auth.signInWithPassword({email,password:pass});
      if(error) return toast(error.message==='Invalid login credentials'?'That sign-in and password do not match.':error.message);
    }
  } finally { if(document.body.contains(btn)) btn.disabled=false; }
}

/* ============ ROUTER ============ */
async function route(keepScroll){
  closeSheet();
  const y=window.scrollY;
  if(keepScroll!==true) window.scrollTo(0,0);
  const parts=(location.hash||'#/home').slice(2).split('/');
  if(parts[0]!=='fun' && window.FUN) window.FUN.stop();
  if(parts[0]!=='walk' && window.WALK) window.WALK.stop();
  if(parts[0]!=='walk' && parts[0]!=='bible'){ try{ sessionStorage.removeItem('sg.fromWalk'); }catch(e){} }
  const n = i => parts[i]===undefined||parts[i]==='' ? undefined : +parts[i];
  try{
    if(parts[0]==='bible'){
      if(parts[1]==='read') await viewRead(parts[2], n(3), n(4), n(5));
      else if(parts[1]==='pick') await viewPick(n(2), n(3));
      else if(parts[1]==='search') await viewSearch();
      else if(parts[1]==='red') await viewRed(n(2), n(3));
      else if(parts[1]==='plans') viewPlans(parts[2]);
      else if(parts[1]==='saved') await viewSaved();
      else if(parts[1]==='study') await viewStudy(n(2), n(3), n(4));
      else if(parts[1]==='word') await viewWord(parts[2]);
      else { const s=bstate(); await viewRead(s.pos.tr, s.pos.b, s.pos.c); }
    }
    else if(parts[0]==='fun'){ renderNav('fellowship'); $app.innerHTML=header()+'<div class="empty">Opening the Fun Room…</div>'; await loadFun(); await window.FUN.route(parts); }
    else if(parts[0]==='library') await viewLibrary();
    else if(parts[0]==='item') await viewItem(decodeURIComponent(parts[1]));
    else if(parts[0]==='fellowship') parts[1]==='new' ? await viewFellowship(parts[2]||'any') : parts[1] ? await viewThread(parts[1]) : await viewFellowship();
    else if(parts[0]==='u') await viewProfile(decodeURIComponent(parts[1]||''));
    else if(parts[0]==='admin') parts[1]==='members' ? await viewMembers() : parts[1]==='applications' ? await viewApplications() : parts[1]==='seeds' ? await viewSeedCodes() : await viewAdmin();
    else if(parts[0]==='give') viewGive();
    else if(parts[0]==='legal') viewLegal(parts[1]);
    else if(parts[0]==='account') viewAccount();
    else if(parts[0]==='membership') await viewMembership();
    else if(parts[0]==='seeds'){ renderNav('home'); $app.innerHTML=header()+'<div class="empty">Opening The Seven Seeds…</div>'; await loadSeeds(); await window.SEEDS.route(parts); }
    else if(parts[0]==='walk'){ renderNav('home'); $app.innerHTML=header()+'<div class="empty">Opening your Daily Walk…</div>'; await loadWalk(); await window.WALK.route(parts); }
    else if(parts[0]==='reset') viewReset();
    else await viewHome();
    if(keepScroll===true) window.scrollTo(0,y);
  }catch(e){ console.error(e); $app.innerHTML=header()+'<div class="empty">Something went wrong. Please refresh.</div>'+footer(); }
}

/* ============ START ============ */
(async function init(){
  if(store('sg.bigtext')) document.documentElement.classList.add('big');
  applyLook();
  new MutationObserver(()=>{
    if(!$app.querySelector('.foot')) $app.insertAdjacentHTML('beforeend', footer());
  }).observe($app,{childList:true});
  S.preview = CONFIG.SUPABASE_URL.includes('YOUR-') || !window.supabase;
  if(!S.preview){
    S.sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data } = await S.sb.auth.getSession(); S.user = data.session?.user || null;
    await loadProfile();
    S.sb.auth.onAuthStateChange(async (event, session)=>{
      if(event==='PASSWORD_RECOVERY'){ S.recovery=true; S.user=session?.user||null; location.hash='#/account'; return viewAccount(); }
      const was=S.user?.id; S.user=session?.user||null;
      if(was!==S.user?.id){ await loadProfile(); S.people={}; await route(); }
    });
  } else { await loadProfile(); }
  window.addEventListener('hashchange', ()=>route());
  await route();
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

/* ============ DOWNLOAD APP BUTTON (hides once the app is installed) ============ */
(function(){
  const ua=navigator.userAgent;
  const isIOS=/iPhone|iPad|iPod/.test(ua) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const installed=()=>matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone===true || store('sg.installed')===true;
  let ask=null;
  const hide=()=>{ document.getElementById('dlapp')?.remove(); document.documentElement.classList.remove('hasdl'); };
  function snoozed(){ const t=store('sg.dlLater'); return t && Date.now()-t < 3*864e5; }
  function show(){
    if(installed() || snoozed() || document.getElementById('dlapp')) return;
    document.body.insertAdjacentHTML('beforeend',`<div class="dlapp" id="dlapp" role="region" aria-label="Download the app"><button class="go" id="dlGo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>Download the App</button><button class="x" id="dlX" aria-label="Hide for now">×</button></div>`);
    document.documentElement.classList.add('hasdl');
    document.getElementById('dlX').onclick=()=>{ store('sg.dlLater',Date.now()); hide(); };
    document.getElementById('dlGo').onclick=async()=>{
      if(ask){ ask.prompt(); const r=await ask.userChoice.catch(()=>null); ask=null; if(r?.outcome==='accepted'){ store('sg.installed',true); hide(); toast('Welcome! Find Sprouted Grace on your home screen. 🌱'); } return; }
      const share='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1E7FD8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5v10h14V11h-1"/></svg>';
      const steps = isIOS
        ? (/CriOS|FxiOS|EdgiOS/.test(ua) ? `<li><span>Tap the ${share} <b>Share</b> button (top or bottom of the screen).</span></li><li><span>Tap <b>Add to Home Screen</b>.</span></li><li><span>Tap <b>Add</b>. Done!</span></li>`
                                         : `<li><span>Tap the ${share} <b>Share</b> button at the bottom of Safari.</span></li><li><span>Scroll down and tap <b>Add to Home Screen</b>.</span></li><li><span>Tap <b>Add</b>. Done!</span></li>`)
        : `<li><span>Tap the browser menu: <b>⋮</b> or <b>☰</b> (top right or bottom).</span></li><li><span>Tap <b>Install app</b> or <b>Add to Home screen</b>.</span></li><li><span>Tap <b>Install</b>. Done!</span></li>`;
      openSheet(`<h3>Get the Sprouted Grace app</h3><p class="note">It's free. It goes on your home screen like any other app. No app store needed.</p><ol class="dlsteps">${steps}</ol><div class="row"><button class="btn wide" id="dlOk">Got it</button></div>`);
      document.getElementById('dlOk').onclick=closeSheet;
    };
  }
  window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); ask=e; show(); });
  window.addEventListener('appinstalled',()=>{ store('sg.installed',true); hide(); });
  matchMedia('(display-mode: standalone)').addEventListener?.('change',e=>{ if(e.matches) hide(); });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(show,1200)); else setTimeout(show,1200);
})();
</script>
